name: Deploy PWA Platform to GitHub Pages

on:
  push:
    branches: [ "main" ] # 監聽主分支，只要執行 git push origin main 就會自動觸發管線

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Web Static Pages Infrastructure
        uses: actions/configure-pages@v4

      - name: Upload Artifacts to Live Hosting Layer
        uses: actions/upload-pages-artifact@v3
        with:
          # 🚨 關鍵檢查點：
          # 如果你的 index.html 就在 GitHub 的最外層（根目錄），請保持為 '.' 
          # 如果 index.html 是放在某個子資料夾（例如叫做 korean-app），請改成 './korean-app'
          path: '.' 

      - name: Deploy Production PWA App Instance
        id: deployment
        uses: actions/deploy-pages@v4